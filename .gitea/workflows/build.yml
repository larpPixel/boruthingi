name: Build and Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux
    runs-on: linux
    container:
      image: ubuntu:24.04
    steps:
      - name: Install Git, Tar and Node.js (required for checkout)
        run: |
          apt-get update
          apt-get install -y git tar nodejs

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            meson \
            ninja-build \
            valac \
            libgtk-4-dev \
            libsoup-3.0-dev \
            libjson-glib-dev \
            libadwaita-1-dev \
            libgdk-pixbuf-2.0-dev

      - name: Configure Meson
        run: meson setup build

      - name: Compile
        run: meson compile -C build

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: danboruthingi-linux
          path: build/danboruthingi

  build-windows:
    name: Build Windows
    runs-on: windows
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-vala
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-libsoup3
            mingw-w64-x86_64-json-glib

      - name: Configure and Build
        shell: msys2 {0}
        run: |
          meson setup build
          meson compile -C build

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: danboruthingi-windows
          path: build/danboruthingi.exe
