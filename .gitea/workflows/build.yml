name: Build and Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux
    runs-on: linux
    container:
      image: ubuntu:24.04
    steps:
      - name: Install Git, Tar, Curl, Python3 (required for checkout and API calls)
        run: |
          apt-get update
          apt-get install -y git tar curl python3
      - name: Checkout code
        run: |
          git clone --depth=1 "http://192.168.1.2:4000/${GITHUB_REPOSITORY}.git" .

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            meson \
            ninja-build \
            valac \
            libgtk-4-dev \
            libsoup-3.0-dev \
            libjson-glib-dev \
            libadwaita-1-dev \
            libgdk-pixbuf-2.0-dev

      - name: Configure Meson
        run: meson setup build

      - name: Compile
        run: meson compile -C build

      - name: Upload artifact to Gitea Release
        shell: bash
        if: github.event_name != 'pull_request'
        env:
          GITEA_SERVER_TOKEN: ${{ github.token }}
        run: |
          set -e

          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG_NAME="build-${SHORT_SHA}"

          # Download tea CLI from dl.gitea.com
          echo "Downloading tea CLI..."
          if curl -sL --connect-timeout 10 "https://dl.gitea.com/tea/0.14.2/tea-0.14.2-linux-amd64" -o /usr/local/bin/tea; then
            chmod +x /usr/local/bin/tea

            echo "Creating release ${TAG_NAME}..."
            GITEA_SERVER_URL="http://192.168.1.2:4000" \
            tea release create \
              --tag "${TAG_NAME}" \
              --title "Build ${SHORT_SHA}" \
              --note "Automated build from commit ${GITHUB_SHA}" \
              --prerelease \
              --asset "build/danboruthingi" \
              --repo "${GITHUB_REPOSITORY}" \
              2>&1 || echo "Release may already exist (re-run), skipping duplicate"
          else
            echo "tea download failed, uploading via curl..."
            API_BASE="http://192.168.1.2:4000/api/v1/repos/${GITHUB_REPOSITORY}"
            RELEASE_RESP=$(curl -s -X POST \
              -H "Authorization: Bearer ${GITEA_SERVER_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG_NAME}\",\"name\":\"Build ${SHORT_SHA}\",\"body\":\"Automated build from commit ${GITHUB_SHA}\",\"prerelease\":true}" \
              "${API_BASE}/releases" 2>/dev/null) || true
            RELEASE_ID=$(echo "${RELEASE_RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)
            if [ -z "${RELEASE_ID}" ]; then
              RELEASE_RESP=$(curl -s "${API_BASE}/releases/tags/${TAG_NAME}" \
                -H "Authorization: Bearer ${GITEA_SERVER_TOKEN}" 2>/dev/null) || true
              RELEASE_ID=$(echo "${RELEASE_RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)
            fi
            if [ -n "${RELEASE_ID}" ]; then
              curl -s -X POST -H "Authorization: Bearer ${GITEA_SERVER_TOKEN}" \
                -F "attachment=@build/danboruthingi" \
                "${API_BASE}/releases/${RELEASE_ID}/assets?name=danboruthingi-linux" > /dev/null && \
              echo "Uploaded via curl successfully"
            else
              echo "Could not create or find release, artifact not uploaded"
            fi
          fi

          echo "Release URL: https://git.jr4.in/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"


