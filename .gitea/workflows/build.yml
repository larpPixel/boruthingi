name: Build and Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux
    runs-on: linux
    container:
      image: ubuntu:24.04
    steps:
      - name: Install Git, Tar and Node.js (required for checkout)
        run: |
          apt-get update
          apt-get install -y git tar nodejs

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            meson \
            ninja-build \
            valac \
            libgtk-4-dev \
            libsoup-3.0-dev \
            libjson-glib-dev \
            libadwaita-1-dev \
            libgdk-pixbuf-2.0-dev

      - name: Configure Meson
        run: meson setup build

      - name: Compile
        run: meson compile -C build

      - name: Upload Binary
        uses: actions/upload-artifact@v3
        with:
          name: danboruthingi-linux
          path: build/danboruthingi

